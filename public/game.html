<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>飞翔的朋克洛德人</title>
<link rel="icon" href="sliver_wolf_lv999.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: #1a1a2e;
  width: 100%;
  height: 100%;
  overflow: hidden;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
body {
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Press Start 2P', monospace, sans-serif;
}
canvas {
  border: 3px solid #e94560;
  border-radius: 8px;
  box-shadow: 0 0 30px rgba(233,69,96,0.4), 0 0 60px rgba(233,69,96,0.2);
  cursor: pointer;
  image-rendering: pixelated;
}
@media (max-width: 500px) {
  canvas {
    border: none;
    border-radius: 0;
    box-shadow: none;
  }
}
/* Intro overlay */
#intro {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.92);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
  padding: 20px;
}
#intro.hidden { display: none; }
#intro .panel {
  background: #1a1a2e;
  border: 3px solid #e94560;
  padding: 28px 24px;
  max-width: 360px;
  width: 90%;
  text-align: center;
  -webkit-font-smoothing: none;
}
#intro h2 {
  color: #FFD700;
  font-size: 20px;
  font-family: monospace;
  margin-bottom: 16px;
  text-shadow: 2px 2px 0 #a08000;
}
#intro p {
  color: #ccc;
  font-size: 13px;
  font-family: monospace;
  line-height: 1.8;
  margin-bottom: 10px;
  text-align: left;
}
#intro .highlight { color: #FFD700; }
#intro .warn { color: #FF4444; }
#intro .btn {
  margin-top: 18px;
  padding: 12px 32px;
  background: #6C5CE7;
  color: #fff;
  border: 3px solid #5a4bd1;
  font-size: 15px;
  font-family: monospace;
  cursor: pointer;
  letter-spacing: 2px;
  text-shadow: 2px 2px 0 #3a2ca0;
  -webkit-font-smoothing: none;
}
#intro .btn:active { background: #5a4bd1; }

/* Nickname input overlay */
#nameInput {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 998;
}
#nameInput.show { display: flex; }
#nameInput .panel {
  background: #1a1a2e;
  border: 3px solid #e94560;
  padding: 24px 20px;
  width: 300px;
  text-align: center;
}
#nameInput h3 {
  color: #FFD700;
  font-size: 16px;
  font-family: monospace;
  margin-bottom: 12px;
  -webkit-font-smoothing: none;
}
#nameInput input {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  font-family: monospace;
  background: #0a0a1a;
  color: #FFF;
  border: 2px solid #555;
  outline: none;
  text-align: center;
  -webkit-font-smoothing: none;
}
#nameInput input:focus { border-color: #6C5CE7; }
#nameInput .btn {
  margin-top: 12px;
  padding: 10px 28px;
  background: #6C5CE7;
  color: #fff;
  border: 3px solid #5a4bd1;
  font-size: 14px;
  font-family: monospace;
  cursor: pointer;
  -webkit-font-smoothing: none;
  text-shadow: 2px 2px 0 #3a2ca0;
}
#nameInput .btn:active { background: #5a4bd1; }
#nameInput .msg {
  margin-top: 8px;
  font-size: 12px;
  font-family: monospace;
  color: #FF4444;
  min-height: 16px;
}
</style>
</head>
<body>
<div id="intro">
  <div class="panel">
    <h2>飞翔的朋克洛德人</h2>
    <p>
      狼尊成功骇入了黑塔女士的宝库，<br>
      拿回了被没收的<span class="highlight">游戏账号</span>！<br>
      但警报已经响起，黑塔随时会回来——<br>
      赶紧穿越庇尔波因特的夜空<span class="highlight">逃命</span>！
    </p>
    <p>
      <span class="warn">规则：</span><br>
      - 点击屏幕拍打翅膀，躲避大楼<br>
      - <span class="highlight">前76根管道</span>碰到了不会扣命<br>
      - 每得3分速度+10%，碰管道重置<br>
      - <span class="warn">第76层</span>将迎来黑塔BOSS战！<br>
      - BOSS战中自动射击，收集道具增强火力
    </p>
    <button class="btn" id="introStart">开始游戏</button>
  </div>
</div>
<div id="nameInput">
  <div class="panel">
    <h3>提交分数</h3>
    <input type="text" id="nameField" placeholder="输入昵称（1-8字）" maxlength="8" autocomplete="off">
    <button class="btn" id="submitBtn">上榜</button>
    <button class="btn" id="closeNameInput" style="background:#555;border-color:#444;margin-top:8px;">关闭</button>
    <div class="msg" id="submitMsg"></div>
  </div>
</div>
<canvas id="game"></canvas>
<script src="js/game-core.js"></script>
<script src="js/game-draw.js"></script>
<script src="js/boss.js"></script>
<script src="js/game-main.js"></script>
</body>
</html>
